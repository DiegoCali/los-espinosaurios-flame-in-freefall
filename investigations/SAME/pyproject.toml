[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autoresearch-same"
version = "0.1.0"
description = "SAME / SAME-R (NASA PSI-102 / PSI-101) smoke-aerosol extraction, moment-method analysis and AutoResearch predictive study"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
  "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["extraction*", "analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
link-mode = "copy"
